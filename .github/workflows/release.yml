name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid release tag format: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (x86_64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows artifacts
        shell: pwsh
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/release/craft-atlas.exe "dist/windows/craft-atlas-v$env:VER-windows-x86_64.exe"
          $zipStage = "dist/windows/stage"
          New-Item -ItemType Directory -Force -Path $zipStage | Out-Null
          Copy-Item target/release/craft-atlas.exe "$zipStage/craft-atlas.exe"
          Copy-Item README.md "$zipStage/README.md"
          if (Test-Path README.en.md) { Copy-Item README.en.md "$zipStage/README.en.md" }
          Compress-Archive -Path "$zipStage/*" -DestinationPath "dist/windows/craft-atlas-v$env:VER-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $zipStage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-artifacts
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  macos:
    name: macOS (Universal arm64 + x86_64)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build Apple Silicon & Intel binaries
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Create Universal .app & .dmg
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          APP_NAME="CraftAtlas.app"
          mkdir -p dist/macos/dmg_stage
          APP_DIR="dist/macos/dmg_stage/$APP_NAME"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          lipo -create \
            target/aarch64-apple-darwin/release/craft-atlas \
            target/x86_64-apple-darwin/release/craft-atlas \
            -output "$APP_DIR/Contents/MacOS/craft-atlas"
          chmod +x "$APP_DIR/Contents/MacOS/craft-atlas"

          cp packaging/macos/Info.plist "$APP_DIR/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VER}" "$APP_DIR/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VER}" "$APP_DIR/Contents/Info.plist"

          ICONSET="dist/macos/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -s format png -z $sz $sz assets/custom_app_icon.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -s format png -z $sz2 $sz2 assets/custom_app_icon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"

          # Ad-hoc codesign required so Apple Silicon allows execution of Universal bundle
          codesign --force --deep --sign - "$APP_DIR"

          ln -s /Applications dist/macos/dmg_stage/Applications
          hdiutil create \
            -volname "CraftAtlas v${VER}" \
            -srcfolder dist/macos/dmg_stage \
            -ov -format UDZO \
            "dist/macos/craft-atlas-v${VER}-macos-universal.dmg"

          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" \
            "dist/macos/craft-atlas-v${VER}-macos-universal-app.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-artifacts
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip

  linux:
    name: Linux (AppImage, deb, rpm, tar.gz)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            rpm \
            desktop-file-utils \
            imagemagick \
            file

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package AppImage, .deb, .rpm, .tar.gz
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x packaging/linux/build-packages.sh
          ./packaging/linux/build-packages.sh "$VER" target/release/craft-atlas dist/linux

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-artifacts
          path: dist/linux/*

  release:
    name: Publish GitHub Release
    needs: [ prepare, windows, macos, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist_all

      - name: Flatten release assets & compute SHA256SUMS
        run: |
          mkdir -p release_assets
          find dist_all -type f -exec mv -t release_assets {} +
          (cd release_assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release_assets

      - name: Attest Build Provenance (Sigstore / SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release_assets/*'

      - name: Prepare Release Notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f "docs/RELEASE_${TAG}.md" ]; then
            cp "docs/RELEASE_${TAG}.md" release_notes.md
          else
            printf "## CraftAtlas %s\n\nCross-platform technical companion and seed map explorer for Minecraft Java Edition (Windows, macOS Universal, Linux AppImage / .deb / .rpm / .tar.gz).\n\nSee [README.md](README.md) (ES) or [README.en.md](README.en.md) (EN).\n" "$TAG" > release_notes.md
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: CraftAtlas ${{ needs.prepare.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release_assets/*
